<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axion — App Parking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --magenta:  #C4006A;
      --magenta2: #9A0055;
      --navy:     #1A2B6B;
      --navy2:    #111E50;
      --bg:       #F0F0F0;
      --bg2:      #E6E6E6;
      --surface:  #FFFFFF;
      --border:   rgba(0,0,0,0.09);
      --muted:    rgba(0,0,0,0.42);
      --text:     #1A1A2E;
      --success:  #057a55;
      --success-bg: #ecfdf5;
      --success-border: #6ee7b7;
      --error:    #b91c1c;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
    }

    /* ── Top bar bicolor ── */
    .top-bar {
      height: 4px;
      background: linear-gradient(90deg, var(--magenta) 50%, var(--navy) 50%);
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    }
    .logo-area { display: flex; align-items: center; gap: 14px; }
    .logo-pill {
      background: var(--magenta);
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 1.15rem;
      letter-spacing: 1px;
      padding: 5px 12px;
      border-radius: 4px;
    }
    .hdivider { width: 1px; height: 32px; background: var(--border); }
    .htext h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--navy);
      letter-spacing: .3px;
    }
    .htext p { font-size: .78rem; color: var(--muted); margin-top: 1px; }
    .hdate { font-size: .82rem; color: var(--muted); text-align: right; }
    .hdate strong { color: var(--navy); font-weight: 600; }

    /* ── Main layout ── */
    main { padding: 24px 28px 56px; max-width: 1100px; margin: 0 auto; }

    .page-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: .4px;
      margin-bottom: 20px;
    }
    .page-title span { color: var(--magenta); }

    /* ── Cards ── */
    .grid-top {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }
    @media (max-width: 780px) { .grid-top { grid-template-columns: 1fr; } }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 22px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .card-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: .3px;
      margin-bottom: 16px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--magenta);
      padding-bottom: 8px;
      display: inline-block;
    }

    /* ── Form elements ── */
    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .4px;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--bg2);
      border-radius: 6px;
      font-size: .92rem;
      font-family: 'Barlow', sans-serif;
      background: #fafafa;
      color: var(--text);
      margin-bottom: 13px;
      transition: border-color .15s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--magenta);
      box-shadow: 0 0 0 2px rgba(196,0,106,.1);
    }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; padding: 11px 16px;
      border: none; border-radius: 6px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem; font-weight: 700; letter-spacing: .5px;
      cursor: pointer; transition: background .15s, transform .1s;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--magenta); color: #fff; }
    .btn-primary:hover { background: var(--magenta2); }
    .btn-navy { background: var(--navy); color: #fff; }
    .btn-navy:hover { background: var(--navy2); }
    .btn-ghost {
      background: none; border: 1px solid var(--border);
      color: var(--muted); font-size: .85rem;
      width: auto; padding: 7px 14px;
    }
    .btn-ghost:hover { border-color: var(--error); color: var(--error); background: #fef2f2; }

    /* ── Resultado ── */
    #resultado {
      display: none;
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      border-radius: 8px;
      padding: 14px 16px;
      margin-top: 14px;
      text-align: center;
    }
    #resultado .res-monto {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2.2rem; font-weight: 900;
      color: var(--success); letter-spacing: .5px;
    }
    #resultado .res-detail { font-size: .82rem; color: var(--muted); margin-top: 3px; }

    /* ── Stats ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat-box {
      background: var(--bg2);
      border-radius: 8px;
      padding: 12px 16px;
      text-align: center;
    }
    .stat-box .sv {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.5rem; font-weight: 900;
      color: var(--navy);
    }
    .stat-box .sl { font-size: .75rem; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: .3px; }
    .stat-box.highlight .sv { color: var(--magenta); }

    /* ── Historial ── */
    .hist-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px;
    }

    .ticket {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      background: #fafafa;
      transition: box-shadow .15s;
    }
    .ticket:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.07); }

    .ticket-badge {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .75rem; font-weight: 700;
      padding: 3px 9px; border-radius: 99px;
      text-transform: uppercase; letter-spacing: .4px; white-space: nowrap;
    }
    .badge-auto { background: rgba(26,43,107,.1); color: var(--navy); }
    .badge-cam  { background: rgba(196,0,106,.1); color: var(--magenta); }

    .ticket-info { flex: 1; min-width: 0; }
    .ticket-info strong {
      display: block; font-size: .9rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ticket-info span { font-size: .78rem; color: var(--muted); }

    .ticket-monto {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.15rem; font-weight: 900;
      color: var(--success); white-space: nowrap;
    }

    .del-btn {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 1rem;
      padding: 4px 7px; border-radius: 4px;
      line-height: 1;
    }
    .del-btn:hover { background: #fee2e2; color: var(--error); }

    .empty { color: var(--muted); font-size: .88rem; text-align: center; padding: 24px 0; }

    /* ── Tarifas ── */
    .tarifa-section { display: flex; gap: 12px; margin-bottom: 14px; }
    .tarifa-section > div { flex: 1; }

    /* ── Scrollable historial ── */
    .hist-scroll { max-height: 420px; overflow-y: auto; padding-right: 2px; }
    .hist-scroll::-webkit-scrollbar { width: 5px; }
    .hist-scroll::-webkit-scrollbar-thumb { background: var(--bg2); border-radius: 99px; }
  </style>
</head>
<body>

<div class="top-bar"></div>

<header>
  <div class="logo-area">
    <div class="logo-pill">AXION</div>
    <div class="hdivider"></div>
    <div class="htext">
      <h1>App Parking</h1>
      <p>Estación de Servicio</p>
    </div>
  </div>
  <div class="hdate" id="hdate"></div>
</header>

<main>
  <div class="page-title">Control de <span>Estadías</span></div>

  <div class="grid-top">

    <!-- Formulario -->
    <div class="card">
      <div class="card-title">Registrar estadía</div>

      <label>Tipo de vehículo</label>
      <select id="tipo">
        <option value="Auto">Auto</option>
        <option value="Camioneta">Camioneta</option>
      </select>

      <label>Patente / Identificación</label>
      <input type="text" id="patente" placeholder="Ej: ABC 123" maxlength="20" />

      <div class="field-row">
        <div>
          <label>Ingreso</label>
          <input type="datetime-local" id="entrada" />
        </div>
        <div>
          <label>Salida</label>
          <input type="datetime-local" id="salida" />
        </div>
      </div>

      <button class="btn btn-primary" id="btn-guardar" onclick="calcular()">Calcular y guardar</button>

      <div id="resultado">
        <div class="res-monto" id="res-monto"></div>
        <div class="res-detail" id="res-detail"></div>
        <div id="sheet-status" style="font-size:.78rem;margin-top:6px;"></div>
      </div>
    </div>

    <!-- Tarifas + stats -->
    <div>
      <div class="card" style="margin-bottom:14px">
        <div class="card-title">Tarifas por hora</div>
        <div class="tarifa-section">
          <div>
            <label>Auto ($)</label>
            <input type="number" id="tarifa-auto" min="0" step="1" value="500" />
          </div>
          <div>
            <label>Camioneta ($)</label>
            <input type="number" id="tarifa-cam" min="0" step="1" value="700" />
          </div>
        </div>
        <p style="font-size:.78rem;color:var(--muted)">Se cobra por hora o fracción iniciada.</p>
      </div>

      <div class="card">
        <div class="card-title">Resumen del día</div>
        <div class="stats-row">
          <div class="stat-box highlight">
            <div class="sv" id="stat-total">$0</div>
            <div class="sl">Total recaudado</div>
          </div>
          <div class="stat-box">
            <div class="sv" id="stat-autos">0</div>
            <div class="sl">Autos</div>
          </div>
          <div class="stat-box">
            <div class="sv" id="stat-cams">0</div>
            <div class="sl">Camionetas</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Historial -->
  <div class="card">
    <div class="hist-header">
      <div class="card-title" style="margin-bottom:0">Historial de estadías</div>
      <button class="btn btn-ghost" onclick="borrarTodo()">Borrar todo</button>
    </div>
    <div class="hist-scroll" id="hist-lista"></div>
  </div>

</main>

<script>
  const KEY = 'axion_parking_v1';

  // ── Pegá aquí la URL de tu Apps Script después de publicarlo ──
  const SHEET_URL = '';

  /* ── Utilidades ── */
  function cargar() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
  }
  function guardar(lista) { localStorage.setItem(KEY, JSON.stringify(lista)); }

  function horasFraccion(entrada, salida) {
    const diff = (new Date(salida) - new Date(entrada)) / 36e5;
    return { decimal: diff, facturadas: Math.ceil(diff) };
  }

  function fmt(dt) {
    return new Date(dt).toLocaleString('es-AR', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function ahoraLocal() {
    const d = new Date(); d.setSeconds(0, 0);
    return d.toISOString().slice(0, 16);
  }

  function moneda(n) { return '$' + n.toLocaleString('es-AR'); }

  /* ── Fecha en header ── */
  function renderFecha() {
    const d = new Date();
    const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
    document.getElementById('hdate').innerHTML =
      `<strong>${dias[d.getDay()]}</strong>, ${d.toLocaleDateString('es-AR', { day:'2-digit', month:'long', year:'numeric' })}`;
  }

  /* ── Enviar a Google Sheets ── */
  async function enviarASheets(registro) {
    if (!SHEET_URL) return;
    const status = document.getElementById('sheet-status');
    status.style.color = 'var(--muted)';
    status.textContent = '⏳ Guardando en Google Sheets...';
    try {
      await fetch(SHEET_URL, {
        method: 'POST',
        body: JSON.stringify(registro)
      });
      status.style.color = 'var(--success)';
      status.textContent = '✓ Guardado en Google Sheets';
    } catch {
      status.style.color = 'var(--error)';
      status.textContent = '⚠ No se pudo guardar en Sheets (registro local guardado)';
    }
  }

  /* ── Calcular ── */
  async function calcular() {
    const tipo    = document.getElementById('tipo').value;
    const patente = document.getElementById('patente').value.trim().toUpperCase();
    const entrada = document.getElementById('entrada').value;
    const salida  = document.getElementById('salida').value;
    const tAuto   = parseFloat(document.getElementById('tarifa-auto').value) || 0;
    const tCam    = parseFloat(document.getElementById('tarifa-cam').value) || 0;

    if (!entrada || !salida) { alert('Completá la fecha de ingreso y salida.'); return; }

    const { decimal, facturadas } = horasFraccion(entrada, salida);
    if (decimal <= 0) { alert('La salida debe ser posterior al ingreso.'); return; }

    const tarifa = tipo === 'Auto' ? tAuto : tCam;
    const monto  = facturadas * tarifa;

    document.getElementById('res-monto').textContent = moneda(monto);
    document.getElementById('res-detail').textContent =
      `${facturadas} hora${facturadas !== 1 ? 's' : ''} × ${moneda(tarifa)}/h` +
      (patente ? ` — ${patente}` : '');
    document.getElementById('sheet-status').textContent = '';
    document.getElementById('resultado').style.display = 'block';

    const registro = { id: Date.now(), tipo, patente: patente || '—', entrada, salida, facturadas, tarifa, monto };

    const lista = cargar();
    lista.unshift(registro);
    guardar(lista);
    renderHistorial();

    await enviarASheets(registro);
  }

  /* ── Eliminar ── */
  function eliminar(id) {
    guardar(cargar().filter(r => r.id !== id));
    renderHistorial();
  }

  function borrarTodo() {
    if (!confirm('¿Borrar todo el historial? Esta acción no se puede deshacer.')) return;
    localStorage.removeItem(KEY);
    renderHistorial();
  }

  /* ── Render historial ── */
  function renderHistorial() {
    const lista = cargar();
    const cont  = document.getElementById('hist-lista');

    if (lista.length === 0) {
      cont.innerHTML = '<p class="empty">Sin registros aún.</p>';
    } else {
      cont.innerHTML = lista.map(r => `
        <div class="ticket">
          <span class="ticket-badge ${r.tipo === 'Auto' ? 'badge-auto' : 'badge-cam'}">${r.tipo}</span>
          <div class="ticket-info">
            <strong>${r.patente}</strong>
            <span>${fmt(r.entrada)} → ${fmt(r.salida)} &nbsp;|&nbsp; ${r.facturadas}h × ${moneda(r.tarifa)}/h</span>
          </div>
          <div class="ticket-monto">${moneda(r.monto)}</div>
          <button class="del-btn" title="Eliminar" onclick="eliminar(${r.id})">✕</button>
        </div>
      `).join('');
    }

    const total = lista.reduce((s, r) => s + r.monto, 0);
    document.getElementById('stat-total').textContent = moneda(total);
    document.getElementById('stat-autos').textContent = lista.filter(r => r.tipo === 'Auto').length;
    document.getElementById('stat-cams').textContent  = lista.filter(r => r.tipo === 'Camioneta').length;
  }

  /* ── Init ── */
  renderFecha();
  document.getElementById('entrada').value = ahoraLocal();
  renderHistorial();
</script>

</body>
</html>
